name: Diagnose deployment file routing
on:
  push:
    branches: [vercel-current-deployment]
    paths:
      - '.github/workflows/recover-site.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect candidate URLs
        shell: bash
        run: |
          set -eu
          BASE='https://druckers-mart-ixut267c6-sumeetdudy1-5957s-projects.vercel.app'
          mkdir -p diagnostics
          probe() {
            name="$1"; url="$2"; out="diagnostics/$name.bin"; headers="diagnostics/$name.headers"
            echo "=== $url ==="
            code="$(curl -sS -L --max-time 45 -D "$headers" -o "$out" -w '%{http_code}' "$url")"
            size="$(wc -c < "$out" | tr -d ' ')"
            echo "URL=$url HTTP=$code BYTES=$size MIME=$(file -b --mime-type "$out")"
            grep -iE '^(HTTP/|content-type:|content-length:|location:|x-vercel-error:)' "$headers" || true
            echo -n 'FIRST_BYTES='
            od -An -tx1 -N24 "$out" | tr -s ' '
            echo 'BODY_PREVIEW:'
            head -c 160 "$out" | strings || true
            echo
          }
          probe home-root "$BASE/"
          probe html-src "$BASE/src/index.html"
          probe hero-root "$BASE/assets/hero.webp"
          probe hero-src "$BASE/src/assets/hero.webp"
          probe collage-root "$BASE/assets/products-collage.webp"
          probe collage-src "$BASE/src/assets/products-collage.webp"
          echo "Diagnostics only; no files will be committed as recovered website assets."
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: deployment-routing-diagnostics
          path: diagnostics/
          retention-days: 3
