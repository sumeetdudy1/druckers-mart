name: Recover production site
on:
  push:
    branches: [vercel-current-deployment]
    paths:
      - '.github/workflows/recover-site.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vercel-current-deployment
      - name: Recover current production assets
        shell: bash
        run: |
          set -eu
          BASE='https://druckers-mart-ixut267c6-sumeetdudy1-5957s-projects.vercel.app'
          mkdir -p recovered/src/assets
          fetch() {
            url="$1"
            out="$2"
            echo "Checking $url"
            code="$(curl -sS -L --retry 2 --max-time 45 -o "$out" -w '%{http_code}' "$url")"
            size="$(wc -c < "$out" | tr -d ' ')"
            echo "RESULT url=$url http=$code bytes=$size"
            [ "$code" -ge 200 ] && [ "$code" -lt 300 ] && [ "$size" -gt 1000 ]
          }
          fetch "$BASE/src/index.html" recovered/src/index.html || exit 11
          fetch "$BASE/src/assets/hero.webp" recovered/src/assets/hero.webp || exit 12
          fetch "$BASE/src/assets/products-collage.webp" recovered/src/assets/products-collage.webp || exit 13
          grep -qi '<html' recovered/src/index.html || exit 14
          for f in recovered/src/assets/hero.webp recovered/src/assets/products-collage.webp; do
            magic="$(dd if="$f" bs=1 skip=8 count=4 2>/dev/null | od -An -tc | tr -d ' \n')"
            test "$magic" = WEBP || { echo "Invalid WebP: $f magic=$magic"; exit 15; }
          done
          wc -c recovered/src/index.html recovered/src/assets/hero.webp recovered/src/assets/products-collage.webp
          sha1sum recovered/src/index.html recovered/src/assets/hero.webp recovered/src/assets/products-collage.webp
      - name: Commit recovered copy
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add recovered
          git commit -m "Recover verified production website files"
          git push origin HEAD:vercel-current-deployment
